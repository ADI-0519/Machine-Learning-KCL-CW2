seed: 21

data:
  name: "cifar10"
  root: "./data"
  num_workers: 2

simclr:
  batch_size: 256
  epochs: 100
  lr: 0.4
  momentum: 0.9
  nesterov: false
  min_lr: 0.000001
  weight_decay: 0.0001
  temperature: 0.5
  projection_dim: 128
  embedding_dim: 512
  save_path: "./results/checkpoints/simclr_resnet18.pt"

selection:
  knn_k: 20
  round_query_sizes: [10, 10, 10, 10, 10]
  clustering: "kmeans"
  modified_alpha: 0.7
  max_clusters: 500
  min_cluster_size: 5

classifier:
  backbone: "resnet18"
  batch_size: 64
  epochs: 30
  lr: 0.025
  momentum: 0.9
  weight_decay: 0.0005

experiment:
  frameworks: ["fully_supervised", "ssl_embedding", "label_spreading_proxy"]
  methods: ["kcenter", "uncertainty", "margin", "entropy", "dbal_proxy", "bald_proxy", "badge_proxy", "random", "tpcrand", "tpcrp", "tpcinv", "tpcnoclust", "tpcrp_ccfl"]
  seeds: [42,43,44]
  ccfl_candidates_per_cluster: 5
  ccfl_refine_steps: 1
  mc_passes: 10
  mc_dropout_p: 0.2
