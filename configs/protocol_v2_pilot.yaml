# Frozen parsed-config SHA-256: c9a65de80f68ce02175a94ef65f8f1c0a8f56027f0df0eeae5243ecba5ba8305
protocol:
  version: "2.0"
  deterministic: true
  test_evaluations_per_round: 1

output:
  root: "./results/protocol_v2"
  resume: true

data:
  name: "cifar10"
  root: "./data"
  num_workers: 2
  num_classes: 10

representation:
  backend: "simclr"
  checkpoint_path: "./results/checkpoints/simclr_resnet18.pt"
  weights_sha256: "05a6b66f8c5605f73f6592db57dd5b28c075ce3bbde8e48fcd0a977c0bb2a814"
  projection_dim: 128
  batch_size: 256
  embedding_seed: 21

selection:
  round_query_sizes: [10, 10]
  knn_k: 20
  max_clusters: 500
  min_cluster_size: 5

evaluation:
  framework: "ssl_embedding"
  epochs: 60
  batch_size: 64
  lr: 2.5
  momentum: 0.9
  weight_decay: 0.0005
  dropout_p: 0.2
  test_policy: "once_after_fixed_epochs"

experiment:
  methods: ["random", "tpcrp", "kcenter", "probcover", "tpcrp_ccfl", "ccfl_candidate_only", "ccfl_unweighted"]
  replicate_seeds: [42, 43, 44, 45, 46]
  primary_comparison:
    method_a: "tpcrp_ccfl"
    method_b: "tpcrp"
    cumulative_budget: 10
    metric: "test_accuracy"

ccfl_variants:
  tpcrp_ccfl:
    candidates_per_cluster: 5
    refine_steps: 1
    use_cluster_weights: true
  ccfl_candidate_only:
    candidates_per_cluster: 5
    refine_steps: 0
    use_cluster_weights: false
  ccfl_unweighted:
    candidates_per_cluster: 5
    refine_steps: 1
    use_cluster_weights: false
  ccfl_weighted:
    candidates_per_cluster: 5
    refine_steps: 1
    use_cluster_weights: true

probcover:
  alpha: 0.95
  delta_search:
    minimum: 0.05
    maximum: 1.50
    step: 0.01
